name: CI/CD Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_desktop:
        description: 'Build native desktop packages'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun run setup

      - name: Build Web Application
        run: bun run build:web

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyawitapi-web-dist
          path: packages/bruno-app/dist
          retention-days: 7

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    needs: build-web
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event.inputs.build_desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact_name: NyawitApi-Windows-Installer
          - os: ubuntu-latest
            platform: linux
            artifact_name: NyawitApi-Linux-Packages
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun run setup

      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nyawitapi-web-dist
          path: packages/bruno-app/dist

      - name: Verify or Build Web Assets
        shell: bash
        run: |
          if [ ! -f "packages/bruno-app/dist/index.html" ]; then
            echo "Web build not found in artifact, compiling web assets..."
            bun run build:web
          else
            echo "Web build successfully restored from artifact."
          fi

      - name: Build Desktop Application
        run: node ./scripts/build-electron.js ${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Desktop Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            packages/bruno-electron/out/*.exe
            packages/bruno-electron/out/*.dmg
            packages/bruno-electron/out/*.zip
            packages/bruno-electron/out/*.AppImage
            packages/bruno-electron/out/*.deb
            packages/bruno-electron/out/latest*.yml
            packages/bruno-electron/out/*.blockmap
          if-no-files-found: warn
          retention-days: 14

  build-desktop-mac:
    name: Build Desktop (mac)
    needs: build-web
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event.inputs.build_desktop == 'true'
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun run setup

      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nyawitapi-web-dist
          path: packages/bruno-app/dist

      - name: Verify or Build Web Assets
        shell: bash
        run: |
          if [ ! -f "packages/bruno-app/dist/index.html" ]; then
            echo "Web build not found in artifact, compiling web assets..."
            bun run build:web
          else
            echo "Web build successfully restored from artifact."
          fi

      - name: Disable Spotlight and Clean Mounts on macOS
        run: |
          sudo mdutil -a -i off || true
          hdiutil detach /Volumes/NyawitApi* -force 2>/dev/null || true
          rm -rf /Volumes/NyawitApi* 2>/dev/null || true
          hdiutil detach /Volumes/NgaRingApi* -force 2>/dev/null || true
          rm -rf /Volumes/NgaRingApi* 2>/dev/null || true

      - name: Build Desktop Application
        run: node ./scripts/build-electron.js mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Desktop Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NyawitApi-macOS-Installer
          path: |
            packages/bruno-electron/out/*.dmg
            packages/bruno-electron/out/*.zip
            packages/bruno-electron/out/latest*.yml
            packages/bruno-electron/out/*.blockmap
          if-no-files-found: warn
          retention-days: 14

  create-release:
    name: Publish GitHub Release
    needs: [build-web, build-desktop, build-desktop-mac]
    if: always() && needs.build-web.result == 'success' && needs.build-desktop.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release-downloads

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find release-downloads/ -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "latest*.yml" -o -name "*.blockmap" \) -exec cp {} release-assets/ \;
          if [ -d "release-downloads/nyawitapi-web-dist" ]; then
            cd release-downloads/nyawitapi-web-dist
            zip -r ../../release-assets/NyawitApi-Web.zip .
            cd ../..
          elif [ -d "release-downloads/ngaringapi-web-dist" ]; then
            cd release-downloads/ngaringapi-web-dist
            zip -r ../../release-assets/NyawitApi-Web.zip .
            cd ../..
          fi
          ls -la release-assets/

      - name: Determine Release Tag and Title
        id: release_info
        run: |
          APP_VERSION=$(node -p "require('./packages/bruno-electron/package.json').version")
          echo "version=${APP_VERSION}" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=Nyawit API ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=v${APP_VERSION}" >> $GITHUB_OUTPUT
            echo "title=Nyawit API v${APP_VERSION}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            ### Nyawit API ${{ steps.release_info.outputs.title }}

            Local-first, git-friendly API IDE and client for modern developers.

            #### What's New in v${{ steps.release_info.outputs.version }}:
            - **Real-Time Auto-Sync & Auto-Refresh**: Instant live synchronization for `.bru` and `.yml` request files modified by external editors (VS Code, Cursor, Git branch switches) without application reloads.
            - **Flexible Auto-Sync Preferences**: Configurable auto-sync toggle under Preferences (General) with manual Reload Collection on sidebar context menu.
            - **Integrated Git Clone Repository**: Clone remote Git repositories directly from Git Studio, Collections sidebar (+), and Workspace Overview.
            - **Automatic Branch Detection**: Proactive remote branch querying with debounced URL loading, default branch auto-selection, and custom branch manual fallback.
            - **Windows Path & Cache Reliability**: Normalized case-insensitive drive letter matching (`C:` vs `c:`), path separator sanitization, ghost tab auto-cleanup, and graceful empty file staging.
            - **Performance & Background Watcher**: Debounced file change processing preventing high CPU/disk thrashing during large multi-file operations.

            #### Download Assets:
            - **Windows**: `NyawitApi_${{ steps.release_info.outputs.version }}_x64_win.exe` (NSIS Installer)
            - **macOS**: `NyawitApi_${{ steps.release_info.outputs.version }}_x64_mac.dmg`, `NyawitApi_${{ steps.release_info.outputs.version }}_arm64_mac.dmg` & `.zip`
            - **Linux**: `NyawitApi_${{ steps.release_info.outputs.version }}_x64_linux.AppImage` & `.deb`
            - **Web App**: `NyawitApi-Web.zip`
          files: release-assets/*
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
